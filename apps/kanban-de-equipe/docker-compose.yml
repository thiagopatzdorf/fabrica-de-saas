# Sobe o app + MongoDB. Antes: cp docker.exemplo.env .env e preencha JWT_SECRET.
#   docker compose up -d --build
#   docker compose exec -e SEED_ADMIN_NAME="Seu Nome" -e SEED_ADMIN_EMAIL=voce@empresa.com \
#     -e SEED_ADMIN_PASSWORD='uma-senha-forte' app node server/seed-admin.js
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-kanban}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      MCP_API_KEY: ${MCP_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_SYNC_MINUTES: ${GITHUB_SYNC_MINUTES:-5}
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
