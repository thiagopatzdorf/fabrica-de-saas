<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Instalar · Ponto Eletrônico</title>
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23888' stroke-width='3'/%3E%3Cpath d='M16 8v8l5 3' fill='none' stroke='%23888' stroke-width='3'/%3E%3C/svg%3E">
<script src="/tema.js"></script>
<link rel="stylesheet" href="/estilo.css">
<link rel="stylesheet" href="/app/app.css">
<script type="module" src="/app/instalar.js"></script>
</head>
<body class="app">
<header class="app-topo">
  <a class="marca" href="/app/" aria-label="Ponto Eletrônico">
    <span class="produto">Ponto Eletrônico</span>
  </a>
  <nav><button type="button" class="tema-botao" data-tema-botao aria-label="Tema"><svg class="ti-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/></svg><svg class="ti-claro" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ti-escuro" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button></nav>
</header>
<main class="app-main app-estreito">
  <form class="cartao-app" data-instalar>
    <h1>Bem-vindo ao Ponto Eletrônico</h1>
    <p class="sub-app">Cadastre a empresa e quem vai cuidar do RH. Leva um minuto.</p>
    <label class="campo">Nome da empresa<input name="empresa" required maxlength="120" autocomplete="organization"></label>
    <label class="campo">CNPJ<input name="cnpj" required inputmode="numeric" placeholder="00.000.000/0000-00"></label>
    <label class="campo">Seu nome<input name="nome" required maxlength="120" autocomplete="name"></label>
    <label class="campo">Seu e-mail<input name="email" type="email" required autocomplete="email"></label>
    <label class="campo">Crie uma senha<small>pelo menos 10 caracteres</small><input name="senha" type="password" minlength="10" required autocomplete="new-password"></label>
    <button class="btn cheio" type="submit">Criar acesso</button>
    <p class="aviso" data-aviso hidden></p>
  </form>
</main>
</body>
</html>
