<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Bater ponto · Ponto Eletrônico</title>
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23888' stroke-width='3'/%3E%3Cpath d='M16 8v8l5 3' fill='none' stroke='%23888' stroke-width='3'/%3E%3C/svg%3E">
<script src="/tema.js"></script>
<link rel="stylesheet" href="/estilo.css">
<link rel="stylesheet" href="/app/app.css">
<script type="module" src="/app/ponto.js"></script>
</head>
<body class="app">
<header class="app-topo">
  <a class="marca" href="/app/" aria-label="Ponto Eletrônico">
    <span class="produto">Ponto Eletrônico</span>
  </a>
  <nav><button type="button" class="tema-botao" data-tema-botao aria-label="Tema"><svg class="ti-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/></svg><svg class="ti-claro" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ti-escuro" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button></nav>
</header>
<main class="app-main app-estreito">
  <section class="cartao-app" data-tela-ponto>
    <p class="sub-app" data-quem>Carregando…</p>
    <div class="relogio-app" data-relogio>--:--:--</div>
    <p class="data-app" data-data></p>
    <div class="camera"><video playsinline muted></video><div class="moldura"></div><div class="estado" data-estado>Abrindo a câmera…</div></div>
    <button class="btn cheio" type="button" data-bater disabled>Registrar ponto</button>
    <p class="aviso" data-aviso hidden></p>
    <div class="hoje" data-hoje></div>
  </section>
  <section class="cartao-app" data-comprovante hidden>
    <h1>Ponto registrado</h1>
    <dl class="comprovante" data-dados></dl>
    <button class="btn cheio leve" type="button" data-de-novo>Voltar</button>
  </section>
</main>
</body>
</html>
