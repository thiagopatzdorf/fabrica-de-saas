name: atualizar

# Toda segunda-feira (e sob demanda): reconfere licença, estrelas e último push de todo o
# catálogo no GitHub, regenera os arquivos e, se algo mudou, abre um PR com o relatório.
# Requer em Settings > Actions > General: "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Instalar PyYAML
        run: python -m pip install pyyaml==6.0.3
      - name: Validar
        run: python scripts/verificar.py --so-validar
      - name: Verificar no GitHub
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verificar.py | tee "$RUNNER_TEMP/relatorio.txt"
      - name: Gerar
        run: python scripts/gerar.py
      - name: Abrir PR se mudou
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada mudou; sem PR."
            exit 0
          fi
          ramo="atualizar/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "James.V1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ramo"
          git add -A
          git commit -m "chore(catalogo): atualizar fatos verificados" -m "Co-Authored-By: James.V1 <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin "$ramo"
          {
            echo "Atualização semanal automática: licença, estrelas e último push conferidos no GitHub."
            echo
            echo "Itens EXCLUÍDOS ou com AVISO abaixo pedem decisão humana (remover ou corrigir o YAML)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/relatorio.txt"
            echo '```'
            echo
            echo "Risco: baixo, só arquivos gerados e catalogo/verificado.json."
          } > "$RUNNER_TEMP/corpo.md"
          gh pr create --base main --head "$ramo" \
            --title "chore(catalogo): atualização semanal dos fatos verificados" \
            --body-file "$RUNNER_TEMP/corpo.md"
