name: ci

# Em PR e em push na main: testes sem rede, esquema do catálogo, arquivos gerados em dia
# e (só em PR) licença/arquivado dos repos NOVOS conferidos no GitHub.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Instalar PyYAML
        run: python -m pip install pyyaml==6.0.3
      - name: Testes (sem rede)
        run: python -m unittest discover -s tests
      - name: Validar o esquema do catálogo
        run: python scripts/verificar.py --so-validar
      - name: Arquivos gerados conferem com os dados
        run: python scripts/gerar.py --conferir
      - name: Conferir no GitHub os repos novos (licença, arquivado)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verificar.py --sem-gravar --estrito
